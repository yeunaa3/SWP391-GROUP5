services:
  mysql:
    image: mysql:8.4
    container_name: premium-news-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-premium_news_ad_local}
      MYSQL_USER: ${MYSQL_USER:-premium_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - premium-news-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  premium-news-mysql-data:
