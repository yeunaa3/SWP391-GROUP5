spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  application:
    name: premium-news-backend
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/premium_news_ad_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:premium_app}
    password: ${DB_PASSWORD:change-me-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  payment:
    bank-code: ${PAYMENT_BANK_CODE:MB}
    account-number: ${PAYMENT_ACCOUNT_NUMBER:08882626999}
    account-name: ${PAYMENT_ACCOUNT_NAME:BUI QUANG CUONG}
  payos:
    client-id: ${PAYOS_CLIENT_ID:${payos.client-id:${PAYOS_CLIENTID:}}}
    api-key: ${PAYOS_API_KEY:${payos.api-key:${PAYOS_APIKEY:}}}
    checksum-key: ${PAYOS_CHECKSUM_KEY:${payos.checksum-key:${PAYOS_CHECKSUMKEY:}}}
  storage:
    provider: ${ASSET_STORAGE_PROVIDER:local}
  upload-directory: ${UPLOAD_DIRECTORY:storage/business}
  news-import:
    enabled: ${NEWS_IMPORT_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    password: ${DEMO_PASSWORD:Demo@12345}
